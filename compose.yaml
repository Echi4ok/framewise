services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATA_DIR: /app/data
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://model:11434/v1}
      MODEL_NAME: ${MODEL_NAME:-qwen3-vl:8b-instruct}
      MODEL_API_KEY: ${MODEL_API_KEY:-local}
      MODEL_RESPONSE_FORMAT: ${MODEL_RESPONSE_FORMAT:-json_schema}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-300}
      MANUAL_IMPORT_TIMEOUT_SECONDS: ${MANUAL_IMPORT_TIMEOUT_SECONDS:-60}
      IMAGE_URL_TIMEOUT_SECONDS: ${IMAGE_URL_TIMEOUT_SECONDS:-20}
      BODY_READ_TIMEOUT_SECONDS: ${BODY_READ_TIMEOUT_SECONDS:-15}
      MAX_CONCURRENT_IMPORTS: ${MAX_CONCURRENT_IMPORTS:-2}
      MAX_MODEL_REQUESTS: ${MAX_MODEL_REQUESTS:-4}
      IMAGE_WORKERS: ${IMAGE_WORKERS:-2}
      STORE_CLEANUP_INTERVAL_SECONDS: ${STORE_CLEANUP_INTERVAL_SECONDS:-30}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  model:
    image: ollama/ollama:0.30.7
    environment:
      OLLAMA_CONTEXT_LENGTH: 12288
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  model-init:
    image: ollama/ollama:0.30.7
    entrypoint: ["/bin/sh", "/prepare-model.sh"]
    volumes:
      - models:/root/.ollama:ro
      - ./scripts/prepare-model.sh:/prepare-model.sh:ro
    environment:
      OLLAMA_HOST: http://model:11434
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-qwen3-vl:8b-instruct}
      MODEL_NAME: ${MODEL_NAME:-qwen3-vl:8b-instruct}
    depends_on:
      model:
        condition: service_healthy

volumes:
  models:
